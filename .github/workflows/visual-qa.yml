name: visual-qa

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reconcile dependency lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Install app dependencies
        run: npm ci

      - name: Build production app
        run: npm run build

      - name: Install browser runner
        run: |
          npm install --no-save --package-lock=false playwright@1.54.1
          npx playwright install --with-deps chromium

      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/rubik-preview.log 2>&1 &
          node - <<'NODE'
          const url = 'http://127.0.0.1:4173';
          const deadline = Date.now() + 30_000;
          while (Date.now() < deadline) {
            try {
              const response = await fetch(url);
              if (response.ok) process.exit(0);
            } catch {}
            await new Promise((resolve) => setTimeout(resolve, 500));
          }
          console.error('Preview server did not become ready.');
          process.exit(1);
          NODE

      - name: Exercise desktop and mobile lessons
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node scripts/visual-qa.mjs

      - name: Upload visual evidence and repaired lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rubik-lab-visual-qa
          path: |
            qa-artifacts
            package-lock.json
            /tmp/rubik-preview.log
          if-no-files-found: warn
          retention-days: 7
